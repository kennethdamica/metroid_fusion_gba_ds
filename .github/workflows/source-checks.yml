name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Source and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check source contents, syntax and documentation links
        run: python tools/check_repository.py
      - name: Test public CLI without game data
        run: python -m unittest discover -s tests/public -v
      - name: Test menu banners without game data
        run: python -m unittest discover -s tests/package -p test_banner.py -v
