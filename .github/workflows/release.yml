name: Build packagers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packagers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtimes:
    name: Build and verify DS runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - name: Validate source and public tests
        run: |
          python tools/check_repository.py
          python -m unittest discover -s tests/public -v
          python -m unittest discover -s tests/package -p test_banner.py -v
      - name: Require the version tag to match the CLI
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py tag "$RELEASE_TAG"
      - name: Build pinned upstream and both enhanced runtimes
        run: |
          python tools/build_baseline.py --clean
          python tools/build_dual_screen.py --hardware-diagnostics --clean
          python tools/build_dual_screen.py --game alttp --package-template --clean
          python tools/check_release.py runtimes
      - name: Transfer only runtime templates and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ds-runtimes
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/hardware-runtime/manifest.json
            artifacts/hardware-runtime/sdcard/FusionTemplate.nds
            artifacts/alttp-package-runtime/manifest.json
            artifacts/alttp-package-runtime/sdcard/ZeldaTemplate.nds
      - name: Preserve compiler logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-build-logs
          retention-days: 7
          path: artifacts/*/build.log

  packager:
    name: Freeze and test (${{ matrix.platform }})
    needs: runtimes
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            executable: gba-ds-pack
          - os: windows-2022
            platform: windows-x86_64
            executable: gba-ds-pack.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ds-runtimes
          path: artifacts
      - name: Install pinned freezer dependencies
        run: python -m pip install -r requirements-packager.txt
      - name: Test public behavior on the native platform
        run: python -m unittest discover -s tests/public -v
      - name: Freeze ROM-free executable
        run: python tools/build_packager.py --output artifacts/release
      - name: Test standalone executable outside the checkout
        run: >-
          python tools/test_packager_public.py
          --executable artifacts/release/${{ matrix.platform }}/${{ matrix.executable }}
          --output artifacts/standalone-${{ matrix.platform }}.json
      - name: Verify Mac ad-hoc signature
        if: runner.os == 'macOS'
        run: codesign --verify --strict artifacts/release/macos-arm64/gba-ds-pack
      - name: Upload tested platform ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/release/gba-ds-pack-*-preview.zip
      - name: Preserve standalone test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-checks-${{ matrix.platform }}
          retention-days: 30
          path: |
            artifacts/standalone-${{ matrix.platform }}.json
            artifacts/release/${{ matrix.platform }}/build.log

  assets:
    name: Audit release ZIPs and generate checksums
    needs: packager
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts/public-release
      - name: Verify exact assets, runtime locks, notices and provenance
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: python tools/check_release.py assets artifacts/public-release --commit "$BUILD_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-release
          if-no-files-found: error
          retention-days: 30
          path: artifacts/public-release/*

  publish:
    name: Publish tagged prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-release
          path: artifacts/public-release
      - name: Create or finish the draft, then publish as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("/tmp/release.json"))["isDraft"], "Refusing to replace an already published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "GBA DS $RELEASE_TAG preview" --notes-file release/packager/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/public-release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
